# ========================================================
#  NanoMQ configuration for NetRadar
# ========================================================

# ── TCP listener ──────────────────────────────────────────
listeners.tcp {
  bind = "0.0.0.0:1883"
  max_connections = 512
}

# ── General ────────────────────────────────────────────────
system {
  num_taskq_thread = 4
  max_taskq_thread = 4
  parallel         = 4
}

# ── MQTT protocol ──────────────────────────────────────────
mqtt {
  max_packet_size       = 10MB
  max_mqueue_len        = 2048
  retry_interval        = 10s
  keepalive_multiplier  = 1.25
}

# ── Authentication ─────────────────────────────────────────
# Username / password required.
# Each file under auth/ is named after the username and contains
# the plaintext password as its only content. setup.sh creates them
# (random passwords); the folder is git-ignored.
auth {
  allow_anonymous = false
  password = {
    include_dirs = ["/etc/nanomq/auth"]
  }
}

# ── Logging ────────────────────────────────────────────────
log {
  to    = [file, console]
  dir   = "/var/log"
  file  = "nanomq.log"
  level = info
}
